# secret-mission-agents.yaml: four more agents for the Secret Mission.
# Apply it with:  ./bin/kubectl apply -f manifests/secret-mission-agents.yaml
#
# All four reuse the kubernetes-agent template and the substrate-harness, so with
# your own agent that's 5 agents sharing the same 2 workers in the kagent-default
# WorkerPool. Each chat you open becomes its own actor; only the ones that are
# answering right now hold a worker.
---
apiVersion: api.kagent.dev/v1alpha3   # kagent 1.x API version
kind: Agent                            # a named agent you can chat with
metadata:
  name: day-shift                      # the name you'll see in the UI
  namespace: kagent
spec:
  template:
    ref:
      name: kubernetes-agent           # same instructions, model and tools as your agent
  harnessRef:
    name: substrate-harness            # same WorkerPool as your agent
---
apiVersion: api.kagent.dev/v1alpha3
kind: Agent
metadata:
  name: night-shift
  namespace: kagent
spec:
  template:
    ref:
      name: kubernetes-agent
  harnessRef:
    name: substrate-harness
---
apiVersion: api.kagent.dev/v1alpha3
kind: Agent
metadata:
  name: on-call
  namespace: kagent
spec:
  template:
    ref:
      name: kubernetes-agent
  harnessRef:
    name: substrate-harness
---
apiVersion: api.kagent.dev/v1alpha3
kind: Agent
metadata:
  name: intern
  namespace: kagent
spec:
  template:
    ref:
      name: kubernetes-agent
  harnessRef:
    name: substrate-harness
